name: Host test
# Renders the AI presenter in several SadTalker settings (same narrator line) and publishes them side by side as release host-test-N.
on:
  workflow_dispatch:
    inputs:
      variants: { description: "space-separated variants", required: false, default: "s256_still s256_pose s512_still_enh s512_pose_enh" }
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Narrator voice
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx==0.6.1 soundfile numpy pillow 2>&1 | tail -1
          pip install -q chatterbox-tts praat-parselmouth 2>&1 | tail -2 | tee pip.log
          mkdir -p models && curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          python3 -c "import json;E=json.load(open('episodes/hosttest.json'));E['align']=False;json.dump(E,open('episodes/hosttest.json','w'))"
          set -o pipefail; python3 voice.py hosttest 2>&1 | tee voice.log
          cp out/ephosttest/vo/open0_*.wav line.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: line, path: "*.wav\n*.log" }
  host:
    needs: voice
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [s256_still, s256_pose, s512_still_enh, s512_pose_enh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: line }
      - name: SadTalker
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          V=${{ matrix.variant }}; case $V in *512*) export ST512=1;; esac
          sudo mkdir -p /opt/st && sudo chown $USER /opt/st && scripts/setup_host.sh /opt/st
          SIZE=256; case $V in *512*) SIZE=512;; esac
          ARGS="--preprocess full --size $SIZE"; case $V in *still*) ARGS="$ARGS --still";; esac; case $V in *enh*) ARGS="$ARGS --enhancer gfpgan";; esac
          cd /opt/st/SadTalker && set -o pipefail && time /opt/st/py/bin/python inference.py --driven_audio $GITHUB_WORKSPACE/line.wav --source_image $GITHUB_WORKSPACE/assets/host/host_v1.png --result_dir /tmp/res $ARGS 2>&1 | tail -40 > $GITHUB_WORKSPACE/host_$V.log
          F=$(ls -t $(find /tmp/res -name "*.mp4" ! -name "temp_*") | head -1); echo "using $F"
          ffmpeg -v error -y -i "$F" -vf "scale=720:1280,fps=30" -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -b:a 160k $GITHUB_WORKSPACE/host_$V.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "host_${{ matrix.variant }}", path: "host_${{ matrix.variant }}.*" }
  ditto:
    needs: voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: line }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Ditto (LivePortrait motion space, CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -1
          pip install -q librosa tqdm filetype imageio opencv-python-headless scikit-image cython imageio-ffmpeg colored onnxruntime mediapipe huggingface_hub 2>&1 | tail -2
          git clone -q --depth 1 https://github.com/antgroup/ditto-talkinghead /opt/ditto && python3 scripts/ditto_cpu.py /opt/ditto
          python3 -c "from huggingface_hub import snapshot_download as s; s('digital-avatar/ditto-talkinghead', local_dir='/opt/ditto/checkpoints', allow_patterns=['ditto_cfg/v0.4_hubert_cfg_pytorch.pkl', 'ditto_pytorch/*', 'ditto_pytorch/*/*'])"
          find /opt/ditto/checkpoints -type f | head -20
          cd /opt/ditto && set -o pipefail && (time python inference.py --data_root ./checkpoints/ditto_pytorch --cfg_pkl ./checkpoints/ditto_cfg/v0.4_hubert_cfg_pytorch.pkl \
            --audio_path $GITHUB_WORKSPACE/line.wav --source_path $GITHUB_WORKSPACE/assets/host/host_v1.png --output_path /tmp/ditto.mp4) 2>&1 | tail -60 > $GITHUB_WORKSPACE/host_ditto.log
          ffmpeg -v error -y -i /tmp/ditto.mp4 -vf "scale=720:-2,fps=30" -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -b:a 160k $GITHUB_WORKSPACE/host_ditto.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: host_ditto, path: "host_ditto.*" }
  publish:
    needs: [host, ditto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arts, merge-multiple: true }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la arts
          gh release create "host-test-${{ github.run_number }}" $(ls arts/* )  -R ${{ github.repository }} --title "Host test ${{ github.run_number }}" --notes "SadTalker variants"

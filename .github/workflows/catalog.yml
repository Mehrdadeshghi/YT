name: Photo catalog
on:
  push:
    branches: [main]
    paths: [catalog.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p dist && python3 catalog.py
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "catalog-${{ github.run_number }}" dist/catalog.md --title "Photo catalog ${{ github.run_number }}" --notes "Image candidates (names, licences, descriptions)"

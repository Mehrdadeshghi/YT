name: Render Shorts
on:
  push:
    branches: [main]
    paths: [queue.txt]
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episodes to render, e.g. 020 022"
        required: true
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Episodes
        id: eps
        run: |
          E="${{ github.event.inputs.episodes }}"
          if [ -z "$E" ]; then E="$(grep -v '^#' queue.txt | tr -s ' \n' ' ')"; fi
          echo "list=$E" >> "$GITHUB_OUTPUT"; echo "Rendering: $E"
      - name: Voice model cache
        uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }
      - name: HF cache (voice clone)
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: chatterbox-v1 }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install -q kokoro-onnx==0.6.1 soundfile numpy pillow piper-tts==1.8.0
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high
          [ -f models/de_DE-thorsten-high.onnx ] || curl -sSL -o models/de_DE-thorsten-high.onnx $HF/de_DE-thorsten-high.onnx
          [ -f models/de_DE-thorsten-high.onnx.json ] || curl -sSL -o models/de_DE-thorsten-high.onnx.json $HF/de_DE-thorsten-high.onnx.json
      - name: Voice clone model (only if an episode uses "voice": "clone")
        run: |
          for e in ${{ steps.eps.outputs.list }}; do grep -q '"voice": *"clone"' episodes/$e.json && NEED=1; done
          if [ -n "$NEED" ]; then pip install -q chatterbox-tts 2>&1 | tail -2; fi
      - name: Decrypt voice reference
        env: { VOICE_KEY: "${{ secrets.VOICE_KEY }}" }
        run: |
          if [ -n "$VOICE_KEY" ] && [ -f assets/voice/mehrdad.wav.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -in assets/voice/mehrdad.wav.enc -out assets/voice/mehrdad.wav -pass env:VOICE_KEY && echo "voice reference ready"; else echo "no VOICE_KEY secret"; fi
      - name: Build
        run: scripts/build.sh ${{ steps.eps.outputs.list }}
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="shorts-${{ github.run_number }}"
          { echo "Wiki Roulette: ${{ steps.eps.outputs.list }}"; echo; for f in dist/*.md; do cat "$f"; echo; echo "---"; done; } > notes.md
          gh release create "$TAG" dist/*.mp4 dist/*.md $(ls dist/*.m4a 2>/dev/null) --title "Shorts ${{ steps.eps.outputs.list }}" --notes-file notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shorts, path: dist/, retention-days: 30 }

name: Render Shorts
on:
  push:
    branches: [main]
    paths: [queue.txt]
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episodes to render, e.g. 020 022"
        required: true
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Episodes
        id: eps
        run: |
          E="${{ github.event.inputs.episodes }}"
          if [ -z "$E" ]; then E="$(grep -v '^#' queue.txt | tr -s ' \n' ' ')"; fi
          echo "list=$E" >> "$GITHUB_OUTPUT"; echo "Rendering: $E"
      - name: Voice model cache
        uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install -q kokoro-onnx==0.6.1 soundfile numpy
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Build
        run: scripts/build.sh ${{ steps.eps.outputs.list }}
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="shorts-${{ github.run_number }}"
          { echo "Wiki Roulette: ${{ steps.eps.outputs.list }}"; echo; for f in dist/*.md; do cat "$f"; echo; echo "---"; done; } > notes.md
          gh release create "$TAG" dist/*.mp4 dist/*.md --title "Shorts ${{ steps.eps.outputs.list }}" --notes-file notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shorts, path: dist/, retention-days: 30 }

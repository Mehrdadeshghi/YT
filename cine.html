<body>
<canvas id="c" width="1080" height="1920"></canvas>

<script>
// =====================================================================
// WIKI ROULETTE — CINE flagship look (dark, full-bleed, hard cuts).
// Pure function of time: window.seek(t). Sound cues: window.CUES.
// Story visuals are bespoke per episode (EPISODE_VIS), voice + captions come from episodes/<ep>.json
// =====================================================================
const EPID = new URLSearchParams(location.search).get('ep') || '020';
const WIDE = new URLSearchParams(location.search).has('wide');      // ?wide=1 → 16:9 long-form (1920×1080)
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920, BEAT = 0.5, PRE = 0.5, FQ = 60;
const c = document.getElementById('c'), g = c.getContext('2d'); c.width = W; c.height = H;

      PANEL = '#141311', EDGE = '#2C2925', PAPER = '#EDE6D8', PINK = '#1A1714';
let UI = { sub: 'SUBSCRIBE', subbed: 'SUBSCRIBED', photo: 'REAL PHOTO', foot: 'REAL FOOTAGE', full: 'FULL VIDEO · LINKED BELOW' };
let DUR = 44, SCENES = [], WORLD = [], EP = null, CTA = null, SCN = null, RT = null;   // RT: real (unwarped) scene time, for video clips

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };

// ---------- cues ----------
const CUES = []; window.CUES = CUES;
const cue = (t, type, gain = 1, p = 0) => { if (t >= 0) CUES.push({ t: +t.toFixed(3), type, gain, p }); };

// ---------- type ----------
const F = { ui: (s, w = 800) => `${w} ${s}px Inter`, disp: (s) => `400 ${s}px "Archivo Black"`,
            serif: (s) => `700 ${s}px Serif`, mono: (s) => `500 ${s}px JBMono` };
function fit(str, fam, size, maxW) { g.font = F[fam](size); const w = g.measureText(str).width; return w > maxW ? size * maxW / w : size; }
function text(str, x, y, fam, size, color, o = {}) {
  g.save(); g.font = F[fam](size); g.fillStyle = color; g.textAlign = o.align || 'left';
  if (o.ls) g.letterSpacing = o.ls + 'px'; if (o.alpha != null) g.globalAlpha *= clamp(o.alpha);
  if (o.shadow) { g.shadowColor = 'rgba(0,0,0,0.65)'; g.shadowBlur = 24; g.shadowOffsetY = 6; }

}
// a line that rises out of a mask, word by word
function rise(str, x, y, fam, size, color, t, tIn, o = {}) {

  const words = str.split(' '), sp = g.measureText(' ').width, ws = words.map((w) => g.measureText(w).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = o.align === 'center' ? x - total / 2 : x;
  words.forEach((w, i) => { const p = spring(t - tIn - i * (o.stagger ?? 0.06), 260, 24);
    if (p > 0.001) { g.save(); g.beginPath(); g.rect(cx - 20, y - size * 1.05, ws[i] + 40, size * 1.35); g.clip();
      g.fillStyle = (o.colors && o.colors[i]) || color; g.fillText(w, cx, y + (1 - p) * size * 1.1); g.restore(); }
    cx += ws[i] + sp; });

}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

  g.save(); g.font = F.mono(o.size || 32); g.letterSpacing = '3px'; const w = g.measureText(str).width + 48, h = (o.size || 32) * 1.9;
  g.translate(x, y); g.scale(s, s); const x0 = o.align === 'left' ? 0 : -w / 2;

// ---------- atmosphere: glow, dust, vignette, grain ----------
const DUST = []; { const r = rng(42); for (let i = 0; i < 70; i++) DUST.push({ x: r() * W, y: r() * H, z: 0.2 + r() * 0.8, ph: r() * 6.28 }); }
function atmosphere(t, glow) {
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  if (glow) { const gr = g.createRadialGradient(glow.x, glow.y, 0, glow.x, glow.y, glow.r);
    gr.addColorStop(0, glow.c); gr.addColorStop(1, 'rgba(12,11,10,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  for (const d of DUST) { const y = ((d.y - t * 26 * d.z) % H + H) % H, x = d.x + Math.sin(t * 0.7 + d.ph) * 14 * d.z;
    g.globalAlpha = 0.05 + 0.16 * d.z; g.fillStyle = '#FFE9C2'; g.beginPath(); g.arc(x, y, 1.2 + 2.6 * d.z, 0, 6.283); g.fill(); }
  g.globalAlpha = 1;
}
const VIG = document.createElement('canvas'); VIG.width = W; VIG.height = H;
{ const x = VIG.getContext('2d'), gr = x.createRadialGradient(W / 2, H * 0.45, Math.max(W, H) * 0.28, W / 2, H * 0.45, Math.max(W, H) * 0.78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.62)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); }
const GRAIN = [];
for (let n = 0; n < 4; n++) { const cv = document.createElement('canvas'); cv.width = W / 2; cv.height = H / 2;
  const cx = cv.getContext('2d'), im = cx.createImageData(W / 2, H / 2), r = rng(900 + n);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() > 0.5 ? 255 : 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = r() * 9; }
  cx.putImageData(im, 0, 0); GRAIN.push(cv); }

// ---------- series chrome ----------
const TAGY = WIDE ? 84 : 305;
function tag(t, i, n) {
  text('WIKI ROULETTE', 80, TAGY, 'mono', 28, DIM, { ls: 5 });
  g.font = F.mono(28); g.letterSpacing = '5px'; const w = g.measureText('WIKI ROULETTE').width; g.letterSpacing = '0px';
  rrect(80 + w + 22, TAGY - 29, 96, 40, 20); g.fillStyle = GOLD; g.fill(); text('#' + String(EP.ep).padStart(3, '0'), 80 + w + 34, TAGY, 'mono', 26, BG);
  if (i == null || WIDE) return; if (SCN != null) i = SCN;
  for (let k = 0; k < n; k++) { const x = 1000 - (n - k) * 34 + 10; g.fillStyle = k < i ? GOLD : k === i ? TXT : '#3A3631';
    g.beginPath(); g.arc(x, 294, k === i ? 8 : 6, 0, 6.283); g.fill(); }
}

// ---------- captions: big, centred, current word boxed in gold ----------
// word-synced captions (ep.wordCaps + Whisper word times in voice.json): every spoken word, 1-3 per chunk, boxed when spoken;
// words that are *starred* in "cap" (or end in "!") are gold and punch the camera

  const show = sg.show ? sg.show.split(' ').filter(Boolean) : null, useShow = show && show.length === pl.words.length;
  const words = pl.words.map((x, j) => { let w = useShow ? show[j] : x.w; const core = w.replace(/[^\p{L}\p{N}'-]/gu, '');
    if (spell[core]) w = w.replace(core, spell[core]);

    if (/[.?!:,…]["”]?$/.test(x.w) || cur.length >= 3 || len > 15 || (words[k + 1] && words[k + 1].t0 - x.t1 > 0.25)) { chunks.push(cur); cur = []; len = 0; } });

    if (EP_RAW.wordCaps && pl.words && !sg.cta) return wordCaps(sg, pl);
    if (!sg.cap) return null;
    const raw = sg.cap.split(' ').filter(Boolean); let acc = false;
    const words = raw.map((tok) => { let w = tok, a = acc;
      if (/^[^A-Za-z0-9]*\*/.test(w)) { a = true; acc = true; w = w.replace('*', ''); }
      if (/\*[^A-Za-z0-9]*$/.test(w)) { w = w.replace(/\*(?=[^*]*$)/, ''); acc = false; }

  let k = 0; sg.words.forEach((x, j) => { if (t >= x.t0 - 0.02) k = j; });
  const ch = sg.chunks.find((q) => q.includes(k)); if (!ch) return;
  const S = WIDE ? 64 : 92; g.font = F.ui(S); const sp = g.measureText(' ').width;
  const lines = [[]]; let lw = 0;
  ch.forEach((j) => { const w = g.measureText(sg.words[j].w).width; if (lw + w > (WIDE ? 1400 : 860) && lines.at(-1).length) { lines.push([]); lw = 0; } lines.at(-1).push(j); lw += w + sp; });
  const LH = WIDE ? 80 : 112, y0 = yc - (lines.length - 1) * LH / 2 + 32;
  lines.forEach((ln, li) => {
    const widths = ln.map((j) => g.measureText(sg.words[j].w).width), tot = widths.reduce((a, b) => a + b, 0) + sp * (ln.length - 1);
    let x = W / 2 - tot / 2; const y = y0 + li * LH;

        g.save(); g.translate(x + w / 2, y - S * 0.35); const sc = (0.8 + 0.2 * p) * (now ? 1.06 : 1); g.scale(sc, sc); g.translate(-w / 2, S * 0.35);
        if (now) { rrect(-16, -S * 0.86, w + 32, S * 1.12, 18); g.fillStyle = GOLD; g.fill(); }
        g.font = F.ui(S); g.textAlign = 'left'; g.lineJoin = 'round';
        if (!now) { g.lineWidth = 14; g.strokeStyle = 'rgba(0,0,0,0.55)'; g.strokeText(wd.w, 0, 0); }
        g.fillStyle = now ? BG : wd.a ? GOLD : TXT; g.fillText(wd.w, 0, 0);
        g.restore(); }

}

// =====================================================================
// MAP (dark, full bleed)
// =====================================================================
let MAPPATH = null, MAPCOS = 1;
function mapInit(lat0) { MAPCOS = Math.cos(lat0 * Math.PI / 180); MAPPATH = new Path2D();
  for (const f of WORLD) { const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) { ring.forEach(([lo, la], j) => j ? MAPPATH.lineTo(lo * MAPCOS, -la) : MAPPATH.moveTo(lo * MAPCOS, -la)); MAPPATH.closePath(); } } }

  return { k, P: (lo, la) => [540 + (lo - lon) * MAPCOS * k, cy + (lat - la) * k],
    apply: () => { g.translate(540, cy); g.scale(k, k); g.translate(-lon * MAPCOS, lat); } }; }

// =====================================================================
// ECG
// =====================================================================
const gau = (x, m, s) => Math.exp(-(((x - m) / s) ** 2));

  rrect(x0, y, w, h, 28); g.fillStyle = PANEL; g.fill(); g.lineWidth = 3; g.strokeStyle = o.edge || EDGE; g.stroke();
  g.save(); rrect(x0, y, w, h, 28); g.clip();
  g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 2; g.beginPath();
  for (let gx = x0 + 40; gx < x0 + w; gx += 46) { g.moveTo(gx, y); g.lineTo(gx, y + h); } for (let gy = y + 30; gy < y + h; gy += 46) { g.moveTo(x0, gy); g.lineTo(x0 + w, gy); } g.stroke();

  const vy = base - val(T) * amp; g.fillStyle = col; g.beginPath(); g.arc(X1, vy, 9, 0, 6.283); g.fill();

  g.save(); g.font = F.disp(64); g.textAlign = 'right'; g.fillStyle = TXT; g.fillText(sub, x0 + w - 36, y + 76); g.restore();
  if (o.subLabel) text(o.subLabel, x0 + w - 36, y + 112, 'mono', 22, DIM, { align: 'right', ls: 2 });
}

// =====================================================================
// =====================================================================
// Episode visuals live in cine/<ep>.js and fill VIS: VIS.open, VIS[0..n-1]  (build(K, S) -> draw(t))
// =====================================================================
const VIS = {}, PHOTOS = {}, CREDITS = {}, CLIPS = {}, RECAP = [];   // CLIPS[id] = [Image…] — real video footage as 30 fps frames
// shared: the hook, stacked big on frame 0 (last line in gold); returns the y below it
function hook(t, lines, y0 = 500, o = {}) {
  const s = Math.min(...lines.map((l) => fit(l, 'disp', o.size || 150, o.maxW || (WIDE ? 1300 : 920))));
  lines.forEach((l, i) => { const last = i === lines.length - 1;
    text(l, 80, y0 + i * s * 1.02, 'disp', s, last ? GOLD : TXT, { shadow: true }); });
  return y0 + (lines.length - 1) * s * 1.02;

// =====================================================================
// timeline: hard cuts with a punch-in; the loop point is a cut back to the hook
// =====================================================================
function voPlace(segs = [], durs = []) {
  let end = 0;

    const at = typeof sg.at === 'string' ? end + parseFloat(sg.at) : sg.at;
    end = at + d; return { at, end, file: durs[i] && durs[i].file, words: durs[i] && durs[i].words }; });

// sw('drogba') → the moment that word is spoken, in the current scene's visual time (k-th occurrence, fallback d)
let AT = null, PUNCH = [], EP_RAW = {};

  return (q, d = 1, k = 0) => { const n = nw(q), hit = all.filter((x) => x.n.startsWith(n))[k]; return hit ? toVis(hit.t) : d; }; }

  let t = openDur;

    const dur = ep.tight ? Math.max(1.6, ceilQ(vo.at(-1).end - PRE + 0.2)) : slow, warp = ep.tight ? Math.min(1.7, Math.max(1, (slow - PRE) / dur)) : 1;

    const K = (e, ty, gn, p) => cue(from + (e - PRE) / warp, ty, gn, p), vis = VIS[sc.vis ?? i](K, { vo });
    const P0 = PUNCH.length, caps = makeCaptions(sc.vo, vo, sc.noCap || []); for (let q = P0; q < PUNCH.length; q++) PUNCH[q] += from - PRE;

<!doctype html>
<html lang="en">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #04060C; }

  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="18.00" data-width="1080" data-height="1920" data-fps="30">
      <div id="globe" data-composition-id="globe" data-composition-src="compositions/globe.html" data-start="0.000" data-duration="3.050"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:1"></div>
      <div id="photo" data-composition-id="photo" data-composition-src="compositions/photo.html" data-start="3.000" data-duration="3.350"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:2"></div>
      <div id="map" data-composition-id="map" data-composition-src="compositions/map.html" data-start="6.300" data-duration="8.150"
        data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:3"></div>
      <div id="globe2" data-composition-id="globe2" data-composition-src="compositions/globe2.html" data-start="14.400" data-duration="3.600"
        data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:4"></div>
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html" data-start="0.000" data-duration="18.000"
        data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:10"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;


      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#globe", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#photo", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#map", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#globe2", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — globe→photo : zoom-through (push deeper) (cut @3)
      tl.to("#globe", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 2.79);
      tl.to("#globe", { autoAlpha: 0, duration: 0.21, ease: "none" }, 2.79);
      tl.set("#globe", { autoAlpha: 0 }, 3);
      tl.fromTo("#photo", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 3);
      
      // SEAM — photo→map : zoom-through (push deeper) (cut @6.3)
      tl.to("#photo", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 6.09);
      tl.to("#photo", { autoAlpha: 0, duration: 0.21, ease: "none" }, 6.09);
      tl.set("#photo", { autoAlpha: 0 }, 6.3);
      tl.fromTo("#map", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 6.3);
      
      // SEAM — map→globe2 : inverse zoom-through (arrival: the whole planet) (cut @14.4)
      tl.to("#map", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 14.19);
      tl.to("#map", { autoAlpha: 0, duration: 0.21, ease: "none" }, 14.19);
      tl.set("#map", { autoAlpha: 0 }, 14.4);
      tl.fromTo("#globe2", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 14.4);
      
      // </seams:auto>
      tl.set({}, {}, 18.00);
    </script>
  </body>
</html>

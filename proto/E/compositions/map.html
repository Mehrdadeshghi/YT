  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const EZ = {
        lin: (u) => u,
        io2: (u) => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
        io3: (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
        o3: (u) => 1 - Math.pow(1 - u, 3), o4: (u) => 1 - Math.pow(1 - u, 4), i3: (u) => u * u * u, i4: (u) => u * u * u * u,
        oexpo: (u) => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u),
      };
      // keyframed value: K = [{t, v..., e}] — each key eases FROM the previous key over [prev.t, key.t]
      function kf(K, t, prop) {
        if (t <= K[0].t) return K[0][prop];
        for (let i = 1; i < K.length; i++) {
          const a = K[i - 1], b = K[i];
          if (t <= b.t) { const u = EZ[b.e || 'io3']((t - a.t) / Math.max(1e-6, b.t - a.t)); return a[prop] + (b[prop] - a[prop]) * u; }
        }
        return K[K.length - 1][prop];
      }
      // camera over a big image: source point (cx, cy) lands on frame point (fx, fy) at scale s; zoom interpolated in log space
      function camAt(K, t) {
        const ls = (k) => Math.log(k.s);
        if (t <= K[0].t) return K[0];
        for (let i = 1; i < K.length; i++) {
          const a = K[i - 1], b = K[i];
          if (t <= b.t) {
            const u = EZ[b.e || 'io3']((t - a.t) / Math.max(1e-6, b.t - a.t)), L = (p) => a[p] + (b[p] - a[p]) * u;
            return { cx: L('cx'), cy: L('cy'), fx: L('fx'), fy: L('fy'), s: Math.exp(ls(a) + (ls(b) - ls(a)) * u) };
          }
        }
        return K[K.length - 1];
      }
      function applyCam(el, c) {
        el.style.transform = `translate(${(c.fx - c.cx * c.s).toFixed(2)}px, ${(c.fy - c.cy * c.s).toFixed(2)}px) scale(${c.s.toFixed(5)})`;
      }
      const toFrame = (c, x, y) => [c.fx + (x - c.cx) * c.s, c.fy + (y - c.cy) * c.s];

      const wrap = document.getElementById("m-wrap"), front = document.getElementById("m-front");
      const CAM = [{"t": 0, "cx": 75.3, "cy": 58.5, "s": 10.5, "fx": 430, "fy": 800}, {"t": 0.55, "cx": 79.3, "cy": 58.5, "s": 9.0, "fx": 430, "fy": 800, "e": "o3"}, {"t": 1.95, "cx": 110, "cy": 48, "s": 6.2, "fx": 470, "fy": 760}, {"t": 3.35, "cx": 150, "cy": 95, "s": 3.6, "fx": 470, "fy": 760}, {"t": 4.75, "cx": 210, "cy": 150, "s": 2.4, "fx": 500, "fy": 760}, {"t": 6.2, "cx": 442, "cy": 284, "s": 1.1, "fx": 540, "fy": 770, "e": "io3"}], RF = [{"t": 0, "r": 4}, {"t": 0.55, "r": 37.689272632864274, "e": "o3"}, {"t": 1.95, "r": 86.13961863229177, "e": "io2"}, {"t": 3.35, "r": 178.9130545576629, "e": "io2"}, {"t": 4.75, "r": 311.2474895466961, "e": "io2"}, {"t": 6.4, "r": 520, "e": "io2"}], P = {"volc": [69.3, 54.5], "yakima": [98.2, 67.5], "spokane": [144.1, 31.9], "yellowstone": [220.2, 130.4], "denver": [303.8, 240.4]};
      const pinEls = { v: "volc", yakima: "yakima", spokane: "spokane", yellowstone: "yellowstone", denver: "denver" };
      function render(t) {
        const c = camAt(CAM, t); applyCam(wrap, c);
        front.setAttribute("r", kf(RF, t, "r").toFixed(2));
        for (const [id, k] of Object.entries(pinEls)) {
          const q = toFrame(c, P[k][0], P[k][1]), el = document.getElementById(id === "v" ? "m-v" : "m-p-" + id);
          el.style.transform = `translate(${q[0].toFixed(1)}px, ${q[1].toFixed(1)}px)`;
        }
        const n = document.getElementById("m-n"), nv = String(Math.round(clamp((t - 5.95) / 1.1, 0, 1) * 11)); if (n.textContent !== nv) n.textContent = nv;
      }
      // the eruption shock ring on entry
      tl.fromTo("#m-shock", { scale: 1, opacity: 1 }, { scale: 9, opacity: 0, duration: 0.9, ease: "power2.out" }, 0.0);
      // pins: pop exactly when the ash front reaches them
      const BT = [0.55, 1.95, 3.35, 4.75], BK = ["yakima", "spokane", "yellowstone", "denver"];
      BK.forEach((k, i) => {
        tl.set("#m-p-" + k, { opacity: 1 }, BT[i] - 0.05);
        tl.fromTo("#m-p-" + k + " .dot", { scale: 2.2 }, { scale: 1, duration: 0.35, ease: "back.out(1.7)" }, BT[i] - 0.05);
        tl.fromTo("#m-p-" + k + " .plab", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power4.out" }, BT[i]);
      });
      // headline beats: waterfall entry, then a waterfall cut to the LEFT into the next beat
      const starts = BT.concat([5.95]);
      starts.forEach((at, i) => {
        const ws = document.querySelectorAll("#m-b" + i + " .w");
        ws.forEach((w, j) => {
          const ti = at + 0.05 * (1 - Math.pow(0.84, j)) / 0.16;

      tl.to("#m-n", { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 7.15);
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 8.150, duration: 8.150, ease: "none", onUpdate: () => render(st.t) }, 0);
      render(0);

      window.__timelines["map"] = tl;

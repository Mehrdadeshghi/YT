<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>5 tallest buildings</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05060A; }
      #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05060A; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="16.00" data-width="1080" data-height="1920" data-fps="30">
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0.000" data-duration="1.550"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:1"></div>
      <div id="e5" data-composition-id="e5" data-composition-src="compositions/e5.html" data-start="1.500" data-duration="2.450"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:2"></div>
      <div id="e4" data-composition-id="e4" data-composition-src="compositions/e4.html" data-start="3.900" data-duration="2.450"
        data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:3"></div>
      <div id="e3" data-composition-id="e3" data-composition-src="compositions/e3.html" data-start="6.300" data-duration="2.450"
        data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:4"></div>
      <div id="e2" data-composition-id="e2" data-composition-src="compositions/e2.html" data-start="8.700" data-duration="2.450"
        data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:5"></div>
      <div id="e1" data-composition-id="e1" data-composition-src="compositions/e1.html" data-start="11.100" data-duration="4.900"
        data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:6"></div>
      <div id="chart" data-composition-id="chart" data-composition-src="compositions/chart.html" data-start="0.000" data-duration="16.000"
        data-track-index="7" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:10"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;


      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#intro", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#e5","#e4","#e3","#e2"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#e1", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — intro→#5 : cut-the-curve LEFT (title waterfall-cuts out) (cut @1.5)
      tl.to("#intro", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 1.16);
      tl.set("#intro", { autoAlpha: 0 }, 1.5);
      tl.fromTo("#e5", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 1.5);
      
      // SEAM — #5→#4 : cut-the-curve LEFT (cut @3.9)
      tl.to("#e5", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 3.56);
      tl.set("#e5", { autoAlpha: 0 }, 3.9);
      tl.fromTo("#e4", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 3.9);
      
      // SEAM — #4→#3 : cut-the-curve LEFT (cut @6.3)
      tl.to("#e4", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 5.96);
      tl.set("#e4", { autoAlpha: 0 }, 6.3);
      tl.fromTo("#e3", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 6.3);
      
      // SEAM — #3→#2 : cut-the-curve LEFT (cut @8.7)
      tl.to("#e3", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 8.36);
      tl.set("#e3", { autoAlpha: 0 }, 8.7);
      tl.fromTo("#e2", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 8.7);
      
      // SEAM — #2→#1 : inverse zoom-through (arrival: the winner lands) (cut @11.1)
      tl.to("#e2", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 10.89);
      tl.to("#e2", { autoAlpha: 0, duration: 0.21, ease: "none" }, 10.89);
      tl.set("#e2", { autoAlpha: 0 }, 11.1);
      tl.fromTo("#e1", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 11.1);
      
      // </seams:auto>
      tl.set({}, {}, 16.00);
    </script>
  </body>
</html>

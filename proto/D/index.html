<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Guess it in 3 seconds</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06080C; }
      #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #06080C; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="18.00" data-width="1080" data-height="1920" data-fps="30">
      <div id="r1" data-composition-id="r1" data-composition-src="compositions/r1.html" data-start="0.000" data-duration="7.550"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:1"></div>
      <div id="r2" data-composition-id="r2" data-composition-src="compositions/r2.html" data-start="7.500" data-duration="7.550"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:2"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="15.000" data-duration="3.000"
        data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:3"></div>
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html" data-start="0.000" data-duration="15.050"
        data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="position:absolute; inset:0; z-index:10"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;


      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#r1", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#r2","#end"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      
      // SEAM — round1→round2 : cut-the-curve LEFT (cut @7.5)
      tl.to("#r1", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 7.16);
      tl.set("#r1", { autoAlpha: 0 }, 7.5);
      tl.fromTo("#r2", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 7.5);
      
      // SEAM — round2→end : cut-the-curve UP (conclusion rises) (cut @15)
      tl.to("#r2", { yPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 14.66);
      tl.set("#r2", { autoAlpha: 0 }, 15);
      tl.fromTo("#end", { yPercent: 10, autoAlpha: 0.35 }, { yPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 15);
      
      // </seams:auto>
      tl.set({}, {}, 18.00);
    </script>
  </body>
</html>
